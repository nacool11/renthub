<nav class="rh-nav">
  <div class="container d-flex align-items-center justify-content-between">
    <a routerLink="/" class="brand">
      <i class="bi bi-house-heart-fill"></i> Rent<span>Hub</span>
    </a>

    <div class="d-flex align-items-center gap-2">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item-link"
        >Home</a
      >

      @if (auth.isLoggedIn()) {
        <a routerLink="/create" routerLinkActive="active" class="nav-item-link">
          <i class="bi bi-plus-circle"></i> Post a listing
        </a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-item-link">
          <i class="bi bi-person-circle"></i> {{ auth.currentUser()?.name }}
        </a>
        <button class="btn btn-outline-primary btn-sm" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login" class="btn btn-outline-primary btn-sm">Login</a>
        <a routerLink="/register" class="btn btn-primary btn-sm">Register</a>
      }
    </div>
  </div>
</nav>
