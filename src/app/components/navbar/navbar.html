<nav class="rh-nav">
  <div class="container d-flex align-items-center justify-content-between">
    <a routerLink="/" class="brand"><i class="bi bi-house-heart-fill"></i> renthub</a>

    <div class="d-flex align-items-center gap-1">
      @if (auth.isLoggedIn()) {
        <a routerLink="/create" class="nav-item-link d-none d-md-inline">Post a listing</a>
        <a routerLink="/profile" class="user-pill">
          <i class="bi bi-list"></i>
          <span class="dot">{{ auth.currentUser()?.name?.[0] }}</span>
          <span class="d-none d-sm-inline">{{ auth.currentUser()?.name }}</span>
        </a>
        <button class="btn btn-link btn-sm" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login" class="nav-item-link">Login</a>
        <a routerLink="/register" class="btn btn-primary btn-sm">Register</a>
      }
    </div>
  </div>
</nav>
