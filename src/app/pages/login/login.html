<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Login</h2>

    @if (error()) {
      <div class="alert alert-danger">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          class="form-control"
          formControlName="email"
          [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <div class="invalid-feedback d-block">Enter a valid email.</div>
        }
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <div class="invalid-feedback d-block">Password must be at least 6 characters.</div>
        }
      </div>

      <button class="btn btn-primary" type="submit">Login</button>
      <a routerLink="/register" class="ms-3">Create an account</a>
    </form>
  </div>
</div>
