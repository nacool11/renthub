<div class="row justify-content-center py-5 mx-0">
  <div class="col-md-5 col-lg-4">
    <div class="rh-card p-4">
      <h2 class="h4 mb-1">Welcome back</h2>
      <p class="text-muted mb-3">Log in to post listings, comment and save favourites.</p>

      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            class="form-control"
            formControlName="email"
            [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
          />
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
        <p class="mt-3 mb-0 text-center">
          New here? <a routerLink="/register">Create an account</a>
        </p>
      </form>
    </div>
  </div>
</div>
