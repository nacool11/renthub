<div class="row justify-content-center py-5 mx-0">
  <div class="col-md-5">
    <div class="rh-card p-4">
      <h2 class="mb-3">Create your account</h2>
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input class="form-control" formControlName="name" [class.is-invalid]="invalid('name')" />
          <div class="invalid-feedback">Name is required (min 2 characters).</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            class="form-control"
            formControlName="email"
            [class.is-invalid]="invalid('email')"
          />
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="invalid('password')"
          />
          <div class="invalid-feedback">Minimum 6 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm password</label>
          <input
            type="password"
            class="form-control"
            formControlName="confirm"
            [class.is-invalid]="form.touched && form.hasError('mismatch')"
          />
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Register</button>
        <p class="mt-3 mb-0 text-center">
          Already have an account? <a routerLink="/login">Login</a>
        </p>
      </form>
    </div>
  </div>
</div>
